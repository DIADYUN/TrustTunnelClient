name: Build TrustTunnel for ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build in ARM64 container
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update -y
            apt-get install -y build-essential cmake ninja-build git libssl-dev zlib1g-dev pkg-config cargo rustc
          run: |
            cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build build --target trusttunnel_client -j$(nproc)

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trusttunnel_client-arm64
          path: build/**/trusttunnel_client
