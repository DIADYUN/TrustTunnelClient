name: Build TrustTunnel for ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Toolchain and Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-aarch64-linux-gnu g++-aarch64-linux-gnu python3 python3-pip python3-venv

      - name: Setup Conan and Dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          if [ -f scripts/requirements.txt ]; then
            pip install -r scripts/requirements.txt
          fi
          pip install conan
          if [ -f scripts/bootstrap_conan_deps.py ]; then
            python3 scripts/bootstrap_conan_deps.py || true
          fi

      - name: Configure CMake
        run: |
          source venv/bin/activate
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++

      - name: Build CLI Client
        run: |
          source venv/bin/activate
          cmake --build build --target trusttunnel_client -j$(nproc) || ninja -C build trusttunnel_client

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trusttunnel_client-arm64
          path: build/**/trusttunnel_client
